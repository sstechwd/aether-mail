[package]
name = "aether-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless IMAP/SMTP/keyring CLI. JS never speaks mail protocols."

[[bin]]
name = "aether-cli"
path = "src/main.rs"

[dependencies]
aether-secrets = { path = "../aether-secrets" }
mail-core = { path = "../mail-core" }
thiserror.workspace = true
imap = "2.4"
native-tls = "0.2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "native-tls", "builder", "hostname"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
